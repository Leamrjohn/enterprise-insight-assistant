# O2a: Prometheus scrapes the platform metrics exporter (compose profile
# "observability").  O3 alert rules live in alerts.yml (runbook:
# docs/operations/alert_runbook.md).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agent-platform
    static_configs:
      - targets: ["metrics-exporter:9108"]
