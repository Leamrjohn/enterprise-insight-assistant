name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, ruff-format, pyright]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Install backend and development dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/ci-linux-py312.lock
          python -m pip install --no-index --no-build-isolation -r backend/requirements/base.txt -e './backend[dev]'
          python -m pip check
      - name: Record installed versions
        run: python -m pip list --format=freeze
      - name: Ruff
        if: matrix.check == 'ruff'
        working-directory: backend
        run: python -m ruff check app tests scripts
      - name: Pyright
        if: matrix.check == 'pyright'
        run: python -m pyright --pythonpath "$(command -v python)" --project pyrightconfig.json
      - name: Ruff formatting
        if: matrix.check == 'ruff-format'
        working-directory: backend
        run: python -m ruff format --check app tests scripts

  backend:
    name: Backend (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            paths: tests/unit tests/scripts
          - suite: integration
            paths: tests/integration
    env:
      APP_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_NAME: agent_platform_test
      DATABASE_USER: agent_app
      DATABASE_PASSWORD: changeme_in_production
      MIGRATION_DATABASE_USER: agent_migrator
      BUSINESS_DATABASE_PASSWORD: ci-unused-business-password
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONUTF8: '1'
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme_in_production
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_platform"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7.4.9@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Install backend and development dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/ci-linux-py312.lock
          python -m pip install --no-index --no-build-isolation -r backend/requirements/base.txt -e './backend[dev]'
          python -m pip check
      - name: Record installed versions
        run: python -m pip list --format=freeze
      - name: Bootstrap isolated PostgreSQL roles and databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d agent_platform -v ON_ERROR_STOP=1 < backend/scripts/db/bootstrap_postgres.sql
      - name: Apply migrations as migration role
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Check the newest migration round-trips
        if: matrix.suite == 'integration'
        working-directory: backend
        run: python scripts/db/check_migration_roundtrip.py
      - name: Run ${{ matrix.suite }} tests as application role
        id: tests
        working-directory: backend
        env:
          TEST_PATHS: ${{ matrix.paths }}
        run: |
          read -r -a test_paths <<< "$TEST_PATHS"
          python -m pytest "${test_paths[@]}" -m 'not e2e and not slow' -q --junitxml=test-results/results.xml
      - name: Preserve test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.suite }}-${{ github.run_attempt }}
          path: backend/test-results/results.xml
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.1'
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type-check and build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks v8.18.4, pinned by digest; reviewed false positives are in .gitleaksignore.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full git history
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          "$GITLEAKS_IMAGE" detect --source /repo --redact --no-banner --exit-code 1

  deps:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.1'
      - name: No floating images, actions or versions
        run: python backend/scripts/deps/check_pins.py
      - name: Install pinned pip-audit
        run: python -m pip install --require-hashes -r backend/requirements/security-tools.lock
      # The audit tools exit non-zero on any finding; check_audit.py decides what blocks.
      # The CI lock is what tests run on; the base and ML locks are what the images install.
      - name: Audit backend locks
        run: |
          for lock in ci base ml; do
            python -m pip_audit -r "backend/requirements/$lock-linux-py312.lock" --require-hashes --disable-pip \
              --progress-spinner off -f json -o "pip-audit-$lock.json" || test -s "pip-audit-$lock.json"
            python backend/scripts/security/check_audit.py pip "pip-audit-$lock.json"
          done
      - name: Audit frontend lock
        if: ${{ !cancelled() }}
        run: |
          (cd frontend && npm audit --package-lock-only --json > ../npm-audit.json) || test -s npm-audit.json
          python backend/scripts/security/check_audit.py npm npm-audit.json

  behavior-routing:
    name: Behavior gate (routing)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/ci-linux-py312.lock
          python -m pip install --no-index --no-build-isolation -r backend/requirements/base.txt -e './backend[dev]'
      # Planner replay from committed recordings (a changed prompt misses and fails),
      # then the plan rules on the same frozen held-out set.
      - name: Planner replay and plan rules against the baseline
        working-directory: backend
        run: bash scripts/evaluation/behavior_gate.sh routing

  behavior-data:
    name: Behavior gate (SQL and Knowledge)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Inside the job network the demo database is reached by its service name;
    # the connection policy refuses loopback addresses.
    container:
      image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    env:
      APP_ENV: test
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: agent_platform_test
      DATABASE_USER: agent_app
      DATABASE_PASSWORD: changeme_in_production
      MIGRATION_DATABASE_USER: agent_migrator
      BUSINESS_DATABASE_PASSWORD: ci-unused-business-password
      REDIS_URL: redis://redis:6379/0
      ACME_DEMO_DATABASE_PASSWORD: acme_demo_readonly_password
      HF_HOME: /github/home/huggingface
      PYTHONUTF8: '1'
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme_in_production
          POSTGRES_DB: agent_platform
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_platform"
          --health-interval 5s --health-timeout 3s --health-retries 12
      demo_business_acme:
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: business_owner
          POSTGRES_PASSWORD: acme_owner_password
          POSTGRES_DB: acme_business
        options: >-
          --health-cmd "pg_isready -U business_owner -d acme_business"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # psql comes from the same image as the service, run on the job network.
      - name: Bootstrap isolated PostgreSQL roles and databases
        uses: docker://pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          PGPASSWORD: changeme_in_production
        with:
          entrypoint: psql
          args: -h postgres -U postgres -d agent_platform -v ON_ERROR_STOP=1 -f backend/scripts/db/bootstrap_postgres.sql
      - name: Install backend and local model dependencies
        run: |
          python -m pip install --root-user-action=ignore --require-hashes -r backend/requirements/ci-linux-py312.lock
          python -m pip install --root-user-action=ignore --no-index --no-build-isolation -r backend/requirements/base.txt -e './backend[dev]'
          python -m pip install --root-user-action=ignore --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements/ml-linux-py312.lock
          python -m pip check
      - name: Apply migrations as migration role
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Seed the deterministic acme demo database
        working-directory: backend
        env:
          BUSINESS_DB_HOST: demo_business_acme
          BUSINESS_DB_PORT: '5432'
          BUSINESS_DB_NAME: acme_business
          BUSINESS_DB_USER: business_owner
          BUSINESS_DB_PASSWORD: acme_owner_password
          DEMO_READONLY_USER: acme_readonly
          DEMO_READONLY_PASSWORD: acme_demo_readonly_password
          DEMO_COMPANY_LABEL: Acme 演示公司
        run: python scripts/data/seed_demo_business_database.py
      - name: Restore pinned retrieval models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/huggingface
          key: retrieval-models-${{ hashFiles('backend/scripts/evaluation/prefetch_models.py') }}
      - name: Download pinned retrieval models
        if: steps.models.outputs.cache-hit != 'true'
        working-directory: backend
        run: python scripts/evaluation/prefetch_models.py
      - name: SQL replay against the baseline
        working-directory: backend
        run: bash scripts/evaluation/behavior_gate.sh sql
      - name: Knowledge retrieval against the baseline
        if: ${{ !cancelled() }}
        working-directory: backend
        run: bash scripts/evaluation/behavior_gate.sh retrieval
      - name: Preserve gate reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: behavior-gate-${{ github.run_attempt }}
          path: backend/gate-reports/
          if-no-files-found: warn
          retention-days: 14

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare example configuration
        run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet

  docs:
    name: Docs links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Relative Markdown links resolve
        run: python3 backend/scripts/docs/check_links.py
